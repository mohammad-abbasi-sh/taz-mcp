[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taz-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for taz (taz.de) — Germany's left-liberal daily newspaper: headlines, search, stories by author and full article text via the official RSS feed"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
taz-mcp = "taz_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taz_mcp"]

[tool.pytest.ini_options]
markers = ["live: tests that hit the real www.taz.de feed"]
